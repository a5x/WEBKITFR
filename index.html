<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Webkit</title>
<style>
  :root { --bg:#090d0d; --panel:#101817; --line:#263835; --text:#dce7e2;
      --muted:#82938d; --green:#91e0b1; --amber:#e3c47d; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:radial-gradient(circle at 80% 0%, #18302a 0, transparent 34%), var(--bg);
           color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { width:min(100% - 36px, 620px); margin:38px auto; padding:28px; border:1px solid var(--line);
      border-radius:10px; background:rgba(16,24,23,.94); box-shadow:0 18px 50px rgba(0,0,0,.3); }
  #state { font-size:25px; line-height:1.2; font-weight:700; margin:0 0 9px; color:var(--text); }
  #det { font-size:13px; color:var(--muted); margin:0 0 4px; }
  #det b { color:var(--text); font-weight:600; }
  #cache { font-size:12px; color:#647570; margin:0 0 22px; min-height:14px; }
  #cache.cacheok { color:var(--green); }
  #chooser { padding-top:20px; border-top:1px solid var(--line); }
    #unsupported { margin:0 0 10px; color:#ef7770; font-size:12px; font-weight:700; letter-spacing:.06em; }
  #chooser-title { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
  .choice { display:block; margin:8px 0; padding:13px 15px; border:1px solid var(--line);
        border-radius:6px; background:#0d1413; cursor:pointer; transition:background .15s, border-color .15s; }
  .choice:hover { border-color:#4b6d60; }
  .choice.selected { border-color:var(--green); background:#14271e; color:#f0fff5; }
  .choice input { margin:0 10px 0 0; accent-color:var(--green); vertical-align:middle; }
  #start { margin-top:14px; width:100%; padding:13px 16px; border:0; border-radius:6px;
       background:var(--green); color:#08110d; font:700 14px "Segoe UI", system-ui, sans-serif;
       letter-spacing:.1em; cursor:pointer; }
  #start:hover { background:#b0efc7; }
  #start:disabled { background:#35463f; color:#81928a; cursor:default; }
  .ok { color:var(--green); } .bad { color:#e49a8f; } .warn { color:var(--amber); }
    #brand { text-align:center; padding:20px 10px 18px; background:#0b1211; border-bottom:1px solid var(--line); }
    #brand img { display:block; width:58px; height:58px; margin:0 auto 11px; border-radius:50%; }
    #brand b { font-size:15px; font-weight:700; letter-spacing:.16em; color:var(--text); vertical-align:middle; }
    #credit { padding:0 18px 18px; text-align:center; font-size:11px; color:var(--muted); }
    #credit a { color:var(--green); text-decoration:none; }
    #credit .github-link { display:inline-flex; align-items:center; gap:4px; }
    #credit .github-mark { width:13px; height:13px; filter:invert(82%) sepia(18%) saturate(520%) hue-rotate(91deg) brightness(96%); }
    #credit a:hover { text-decoration:underline; }
    @media (max-width:520px) { #wrap { width:calc(100% - 24px); margin:18px auto; padding:20px; } #state { font-size:22px; } #brand img { width:50px; height:50px; } }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>PS4 Webkit 11.00-13.00</b></div>
<div id="wrap">
    <div id="state">Detecting firmware update...</div>
  <div id="det"></div>
  <div id="cache"></div>
    <div id="chooser">
        <div id="unsupported">UNSUPPORTED VERSION: 11.52</div>
        <p id="chooser-title">Choose the exploit chain to launch</p>
        <label class="choice"><input type="radio" name="bug" value="lapse"> LAPSE 7.00-12.02</label>
        <label class="choice"><input type="radio" name="bug" value="poops"> POOPS 9.00-13.00</label>
        <button id="start" type="button" disabled>START JAILBREAK</button>
    </div>
</div>
<div id="credit">Based on WebKit code by <a class="github-link" href="https://github.com/w90008"><img class="github-mark" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">github.com/w90008</a><br>
UI Website made by <a class="github-link" href="https://github.com/a5x"><img class="github-mark" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">github.com/a5x</a> and Claude</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var startEl = document.getElementById("start");
    var choices = document.querySelectorAll('input[name="bug"]');
    var choiceLabels = document.querySelectorAll(".choice");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function selectedBug() {
        for (var i = 0; i < choices.length; i++)
            if (choices[i].checked) return choices[i].value;
        return null;
    }
    function refreshStart() {
        startEl.disabled = !selectedBug();
        for (var i = 0; i < choiceLabels.length; i++)
            choiceLabels[i].className = choices[i].checked ? "choice selected" : "choice";
    }
    for (var i = 0; i < choices.length; i++) choices[i].addEventListener("change", refreshStart);
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (bug) {
        for (var j = 0; j < choices.length; j++)
            if (choices[j].value === bug) choices[j].checked = true;
        refreshStart();
    }
    if (!key && !params.get("bug")) setState("FIRMWARE NOT SUPPORTED", "bad");
    else setState("Select an exploit", "warn");

    function go() {
        var selected = selectedBug();
        if (!selected) return;
        var nextParams = new URLSearchParams(location.search);
        nextParams.set("bug", selected);
        var target = (selected === "lapse" ? "run_lapse.html" : "run_poops.html")
            + "?" + nextParams.toString();
        setState("loading " + selected + " chain...", "warn");
                    location.replace(target); }
    startEl.addEventListener("click", go);

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setCache("cache unavailable");
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        setState("Select an exploit", "warn");
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        setState("Select an exploit", "warn");
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("READY - PRESS X TO CONTINUE",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            setState("Select an exploit", "warn");
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("READY - PRESS X TO CONTINUE",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            setState("Select an exploit", "warn");
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            setState("Select an exploit", "warn");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            setState("Select an exploit", "warn");
        }, false);
    }
})();
</script>
</body>
</html>
