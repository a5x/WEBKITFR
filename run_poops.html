<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
    :root { --bg:#090d0d; --panel:#101817; --line:#263835; --text:#dce7e2; --muted:#82938d; --green:#91e0b1; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:radial-gradient(circle at 85% 0%, #18302a 0, transparent 32%), var(--bg);
       color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
    #wrap { width:calc(100% - 36px); margin:24px auto; }
    #state { font-size:25px; line-height:1.2; font-weight:700; margin:0 0 14px; }
    #out { white-space:pre-wrap; font:12px/1.55 Consolas, monospace; color:#b8c9c2;
      background:rgba(10,17,16,.95); border:1px solid var(--line); border-radius:8px;
      padding:16px; height:calc(100vh - 128px); min-height:240px; overflow-y:auto; box-shadow:0 14px 36px rgba(0,0,0,.25); }
    .ok { color:var(--green); } .bad { color:#e49a8f; } .warn { color:#e3c47d; }
    #brand { text-align:center; padding:20px 10px 18px; background:#0b1211; border-bottom:1px solid var(--line); }
    #brand img { display:block; width:58px; height:58px; margin:0 auto 11px; border-radius:50%; }
    #brand b { font-size:15px; font-weight:700; letter-spacing:.16em; color:var(--text); vertical-align:middle; }
    @media (max-width:520px) { #wrap { width:calc(100% - 24px); margin:18px auto; } #state { font-size:22px; } #out { padding:12px; } #brand img { width:50px; height:50px; } }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>PS4 Webkit 7.00-13.00</b></div>
<div id="wrap">
  <div id="state">Chargement de POOPS...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
