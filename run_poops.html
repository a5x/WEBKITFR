<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
    :root { --bg:#090d0d; --panel:#101817; --line:#263835; --text:#dce7e2; --muted:#82938d; --green:#91e0b1; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:radial-gradient(circle at 85% 0%, #18302a 0, transparent 32%), var(--bg);
       color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
    #wrap { width:calc(100% - 36px); max-width:1100px; margin:30px auto; }
    #state { display:flex; align-items:center; min-height:58px; padding:0 20px; font-size:25px; line-height:1.2;
      font-weight:700; margin:0 0 14px; border:1px solid var(--line); border-radius:8px; background:rgba(16,24,23,.94);
      box-shadow:0 12px 28px rgba(0,0,0,.2); }
    #state:before { content:""; width:9px; height:9px; flex:0 0 9px; margin-right:12px; border-radius:50%;
      background:var(--green); box-shadow:0 0 14px var(--green); }
    #out { white-space:pre-wrap; font:12px/1.6 Consolas, monospace; color:#b8c9c2;
      background:linear-gradient(180deg, rgba(10,19,17,.98), rgba(7,13,13,.98)); border:1px solid var(--line); border-radius:8px;
      padding:20px; height:calc(100vh - 166px); min-height:300px; overflow-y:auto; box-shadow:0 16px 40px rgba(0,0,0,.3);
      scrollbar-color:#3d6254 #0a1211; }
    #out:before { content:"LIVE EXPLOIT OUTPUT"; display:block; margin-bottom:14px; padding-bottom:10px;
      border-bottom:1px solid #1c2d28; color:var(--muted); font:600 10px/1 "Segoe UI", sans-serif; letter-spacing:.16em; }
    .ok { color:var(--green); } .bad { color:#e49a8f; } .warn { color:#e3c47d; }
    #brand { text-align:center; padding:20px 10px 18px; background:#0b1211; border-bottom:1px solid var(--line); }
    #brand img { display:block; width:58px; height:58px; margin:0 auto 11px; border-radius:50%; }
    #brand b { font-size:15px; font-weight:700; letter-spacing:.16em; color:var(--text); vertical-align:middle; }
    @media (max-width:520px) { #wrap { width:calc(100% - 24px); margin:18px auto; } #state { min-height:52px; padding:0 14px; font-size:22px; } #out { padding:14px; height:calc(100vh - 148px); } #brand img { width:50px; height:50px; } }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>PS4 Webkit 7.00-13.00</b></div>
<div id="wrap">
  <div id="state">Chargement de POOPS...</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_poops.js";</script>
</body>
</html>
